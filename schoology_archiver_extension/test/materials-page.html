<!doctype html>
<!-- A stand-in for /course/{id}/materials (and ?f={folder}), with the markup (as
     seen on fuhsd.schoology.com on 2026-09-26: one cell per row, floated icon and
     a full-width .item-info, the "All Materials" menu hanging below its bar) that
     reader/parse/materials.js and reader/parse/sync.js read, to look at
     overlays/materials.js outside Schoology. Serve schoology_archiver_extension/
     (python3 -m http.server) and open /test/materials-page.html, or
     ?f=8 for the Lesson 8 folder. neo-plan, the gradebook, the folders and the
     archive are faked below; ?notoken plays neo-plan without a token. -->
<html><head><meta charset="utf-8"><title>Materials stand-in</title>
<style>
body { font: 13px Arial, sans-serif; color: #333; background: #fff; margin: 24px; max-width: 900px; }
h2 { margin: 0 0 12px; }
.materials-top { position: relative; height: 38px; }
.materials-filter-wrapper { position: absolute; top: 25px; right: 10px; height: 24px; color: #0677BA; font-size: 12px; }
table#folder-contents-table { border-collapse: collapse; width: 100%; }
#folder-contents-table td { padding: 12px 0 12px 8px; border-bottom: 1px solid #e3e3e3; vertical-align: top; }
.folder-expander { float: left; width: 16px; color: #777; }
.ico { float: left; width: 28px; height: 22px; margin-right: 12px; border-radius: 2px; }
.item-info { float: left; width: calc(100% - 64px); }
.material-row-folder .ico { background: #D9A73A; }
.type-assignment .ico { background: #6E8FAE; }
.type-document .ico { background: #B7B7B7; }
.folder-title a, .item-title a { color: #0677BA; text-decoration: none; font-size: 16px; line-height: 22px; }
.item-body, .folder-description { color: #777; font-size: 11px; margin-top: 2px; }
</style></head>
<body><h2 id="crumb">AP Comp Sci A: McLeodT p2 T1</h2>
<div class="materials-top"><div class="materials-filter-wrapper">All Materials ▾</div></div>
<div id="center-inner"></div>
<script type="module">
const SECTION = '8465375857';
const q = new URLSearchParams(location.search);
const F = (id, name, ...items) => ({ id, name, items });
const a = (id, t, due) => ({ k: 'assignment', id, t, due });
const d = (t) => ({ k: 'document', t });
const f = (id) => ({ k: 'folder', id });
const FOLDERS = {
  root: F('root', 'Materials', f('info'), f('6'), f('7'), f('8'), d('Syllabus.pdf')),
  info: F('info', 'Course Information', d('Course Information.pdf'), a('101', 'Academic Integrity Policy', 'August 14, 2026 at 11:59 pm'), a('102', 'Course Information Agreement', 'August 14, 2026 at 11:59 pm')),
  6: F('6', 'Lesson 6 - Libraries and APIs', d('Lesson 6 Lecture Slides.pdf'), a('601', 'Lab 6.1 Taxes', 'September 15, 2026 at 11:59 pm'), a('602', 'Worksheet 6.4 Random', 'September 16, 2026 at 11:59 pm'), a('603', 'In-class Lab 6.2 - Static Review', 'September 28, 2026 at 11:59 pm')),
  7: F('7', 'Lesson 7 - Simple I/O (printf and Scanner)', d('Lesson 7 Slides and Video.pdf'), a('701', 'Worksheets 7.1 and 7.2', 'September 18, 2026 at 11:59 pm'), a('702', 'Lab 7.1 MadLibs (optional)', 'September 22, 2026 at 11:59 pm')),
  8: F('8', 'Lesson 8 - Control Structures', d('Effective Reading + Agenda 9 - 17.pdf'), a('801', 'Read Lesson 8', 'September 21, 2026 at 11:59 pm'), a('802', 'Lab 8.1 CheckMail', 'September 23, 2026 at 11:59 pm'), a('803', 'Lab 8.2 Happiness Detector', 'September 30, 2026 at 11:59 pm'), a('804', 'HW Quiz 7-8', 'September 24, 2026 at 11:59 pm'), f('8x')),
  '8x': F('8x', 'Lesson 8 extras', a('805', 'Lab 8.3 Extra Credit', 'October 2, 2026 at 11:59 pm')),
};
const GRADES = { 101: '5 / 5', 102: '5 / 5', 601: '10 / 10', 602: '9 / 10', 701: '19.05 / 20', 801: '2 / 2' };
const ITEMS = {
  603: { work: 'todo', due: { on: '2026-09-28' } }, 702: null, 802: { missing: true, work: 'todo' },
  803: { work: 'ready' }, 804: { cleared: true, cleared_by: 'schoology' }, 805: { removed: true },
};
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
function tableHtml(fid) {
  const rows = FOLDERS[fid].items.map((it, i) => {
    if (it.k === 'folder') {
      const sub = FOLDERS[it.id];
      return `<tr id="f-${it.id}" class="material-row-folder dr ${i % 2 ? 'even' : 'odd'}"><td class="folder-contents-cell"><span class="folder-expander">›</span>`
        + `<div class="s-material-folder-row-wrapper"><span class="ico"></span><div class="materials-folder item-info"><div class="folder-title"><a href="/course/${SECTION}/materials?f=${it.id}">${esc(sub.name)}</a></div><div class="folder-description">Assignments and materials</div></div></div></td></tr>`;
    }
    const href = it.k === 'assignment' ? `/assignment/${it.id}` : `/course/${SECTION}/materials/gp/${i}`;
    const body = it.due ? `Due ${it.due}` : '';
    return `<tr id="n-${it.id || i}" class="dr type-${it.k}"><td class="folder-contents-cell"><span class="folder-expander"></span><span class="ico"></span>`
      + `<div class="item-info"><div class="item-title"><a href="${href}">${esc(it.t)}</a></div><div class="item-body"></div><div class="item-subtitle"><span class="small gray">${body}</span></div></div></td></tr>`;
  }).join('');
  return `<table id="folder-contents-table"><tbody>${rows}</tbody></table>`;
}
function gradesHtml() {
  return `<table>${Object.entries(GRADES).map(([id, g]) => `<tr class="report-row item-row" data-id="I-${id}"><th class="title-column"><span class="title">x</span></th><td class="grade-column">${g}</td></tr>`).join('')}</table>`;
}

const here = q.get('f') || 'root';
document.getElementById('center-inner').innerHTML = tableHtml(here);
if (here !== 'root') document.getElementById('crumb').textContent += ` › ${FOLDERS[here].name}`;
// Folder links stay on the stand-in.
for (const link of document.querySelectorAll('.folder-title a')) link.href = `?f=${new URL(link.href).searchParams.get('f')}`;

const mem = { 'course:fuhsd.schoology.com:8465375857': { courseName: 'AP Comp Sci A', runs: [{ at: new Date(Date.now() - 2 * 86400e3).toISOString() }] } };
const watchers = [];
const store = {
  async get(k) { return structuredClone(mem[k]); },
  async set(k, v) { const old = mem[k]; mem[k] = structuredClone(v); for (const w of watchers) w({ [k]: { oldValue: old, newValue: v } }); },
  watch(fn) { watchers.push(fn); },
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function getDoc(url) {
  await wait(120);
  const u = new URL(url);
  const html = u.pathname.endsWith('/student_grades') ? gradesHtml() : tableHtml(u.searchParams.get('f') || 'root');
  return new DOMParser().parseFromString(html, 'text/html');
}
async function call(op, args) {
  await wait(150);
  if (q.has('notoken')) return { ok: false, status: 401, data: { error: 'unauthorized' } };
  if (op === 'items') {
    const items = args.schoology_ids.filter((id) => ITEMS[id]).map((id) => ({ id: `np-${id}`, source_id: id, type: 'assignment', ...ITEMS[id] }));
    return { ok: true, status: 200, data: { items } };
  }
  if (op === 'addItem') { ITEMS[args.item.schoology_id] = { work: 'todo' }; return { ok: true, status: 200, data: { id: 'new', work: 'todo', due: args.item.due_at ? { at: args.item.due_at } : null } }; }
  if (op === 'restore') return { ok: true, status: 200, data: { id: args.id, work: 'todo' } };
  return { ok: false, status: 404, data: {} };
}
async function send() {
  setTimeout(() => store.set('course:fuhsd.schoology.com:8465375857', { ...mem['course:fuhsd.schoology.com:8465375857'], runs: [{ at: new Date().toISOString() }] }), 1500);
  return { ok: true, opened: true };
}

globalThis.__npNoAutoStart = true;
const { start } = await import('../overlays/materials.js');
const loc = { pathname: `/course/${SECTION}/materials`, search: location.search, origin: location.origin, host: 'fuhsd.schoology.com', href: `${location.origin}/course/${SECTION}/materials${here === 'root' ? '' : `?f=${here}`}` };
window.overlay = await start({ loc, call, getDoc, store, send });
</script></body></html>
